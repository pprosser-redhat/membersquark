apiVersion: v1
kind: Service
metadata:
  name: {{ include "membersdb-helm.fullname" . }}
  labels:
    {{- include "membersdb-helm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
      name: db
  selector:
    {{- include "membersdb-helm.selectorLabels" . | nindent 4 }}
